<?xml version="1.0" encoding="UTF-8"?>
<!--
  LotteryAssistant · App Icon · Dark
  1024×1024 全出血方形（iOS 自动套 squircle 蒙版）

  Dark 变体策略
  ─────────────────────────────────────────────────────────────
  · 背景压到近黑的深靛，光晕与星芒整体降亮度/降饱和，避免暗模式下过曝
  · 球体本身略降饱和，但保留足够明度，保证在纯黑壁纸上仍「浮」得起来
  · 白色描边环不透明度提高（0.45/0.50）：暗背景里靠它做边缘分离
  · 几何与 light 完全一致，保证三种外观切换时主体位置不跳
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-label="LotteryAssistant">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#221E55"/>
      <stop offset="0.45" stop-color="#141134"/>
      <stop offset="1"    stop-color="#070613"/>
    </linearGradient>

    <radialGradient id="glowIndigo" cx="0.24" cy="0.20" r="0.62">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowOrange" cx="0.76" cy="0.80" r="0.58">
      <stop offset="0"   stop-color="#EA580C" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#C2410C" stop-opacity="0.12"/>
      <stop offset="1"   stop-color="#C2410C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.52" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.50"/>
    </radialGradient>

    <radialGradient id="ballRed" cx="0.335" cy="0.275" r="0.84">
      <stop offset="0"    stop-color="#F79B9B"/>
      <stop offset="0.22" stop-color="#E85A6B"/>
      <stop offset="0.52" stop-color="#CE1F38"/>
      <stop offset="0.82" stop-color="#9C0F26"/>
      <stop offset="1"    stop-color="#660614"/>
    </radialGradient>

    <linearGradient id="rimRed" x1="0.12" y1="0.08" x2="0.88" y2="0.96">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.56" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.80" stop-color="#F0A96E" stop-opacity="0.40"/>
      <stop offset="1"    stop-color="#FFD9A8" stop-opacity="0.72"/>
    </linearGradient>

    <radialGradient id="ballBlue" cx="0.335" cy="0.275" r="0.84">
      <stop offset="0"    stop-color="#A9C9F5"/>
      <stop offset="0.22" stop-color="#5E92E0"/>
      <stop offset="0.52" stop-color="#2563C9"/>
      <stop offset="0.82" stop-color="#173E9E"/>
      <stop offset="1"    stop-color="#0E2360"/>
    </radialGradient>

    <linearGradient id="rimBlue" x1="0.12" y1="0.08" x2="0.88" y2="0.96">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#93B6EE" stop-opacity="0.38"/>
      <stop offset="1"    stop-color="#D3E2FF" stop-opacity="0.68"/>
    </linearGradient>

    <radialGradient id="specular" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.80"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="dropBall" x="-45%" y="-45%" width="200%" height="200%">
      <feDropShadow dx="20" dy="30" stdDeviation="26"
                    flood-color="#000000" flood-opacity="0.62"/>
    </filter>

    <filter id="blurContact" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <filter id="blurOrb" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="blurSpark" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <clipPath id="clipBlue">
      <circle cx="648" cy="648" r="198"/>
    </clipPath>
  </defs>

  <!-- 1. 背景 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glowIndigo)"/>
  <rect width="1024" height="1024" fill="url(#glowOrange)"/>

  <!-- 2. 摇奖鼓同心环 -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.045">
    <circle cx="512" cy="512" r="332" stroke-width="2"/>
    <circle cx="512" cy="512" r="452" stroke-width="2.5"/>
  </g>
  <g fill="none" stroke="#FDBA74" stroke-opacity="0.08">
    <circle cx="512" cy="512" r="392" stroke-width="1.5"/>
  </g>

  <!-- 3. 背景失焦小球 -->
  <g filter="url(#blurOrb)">
    <circle cx="215" cy="265" r="40" fill="#A5B4FC" opacity="0.13"/>
    <circle cx="845" cy="505" r="30" fill="#FDBA74" opacity="0.15"/>
    <circle cx="325" cy="845" r="34" fill="#FCA5A5" opacity="0.11"/>
    <circle cx="565" cy="150" r="22" fill="#93C5FD" opacity="0.13"/>
    <circle cx="820" cy="775" r="26" fill="#C7D2FE" opacity="0.11"/>
    <circle cx="150" cy="565" r="20" fill="#F9A8D4" opacity="0.09"/>
  </g>

  <!-- 4. 暗角 -->
  <rect width="1024" height="1024" fill="url(#vignette)"/>

  <!-- 5. 蓝球（后置） -->
  <g filter="url(#dropBall)">
    <circle cx="648" cy="648" r="198" fill="url(#ballBlue)"/>
  </g>
  <circle cx="648" cy="648" r="196.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3"/>
  <circle cx="648" cy="648" r="192" fill="none" stroke="url(#rimBlue)" stroke-width="9"/>
  <ellipse cx="588" cy="580" rx="63" ry="46" fill="url(#specular)" opacity="0.66"
           transform="rotate(-38 588 580)"/>

  <!-- 6. 红球投在蓝球上的接触阴影 -->
  <g clip-path="url(#clipBlue)">
    <circle cx="425" cy="425" r="232" fill="#000000" opacity="0.55" filter="url(#blurContact)"/>
  </g>

  <!-- 7. 红球（前置） -->
  <g filter="url(#dropBall)">
    <circle cx="413" cy="413" r="232" fill="url(#ballRed)"/>
  </g>
  <circle cx="413" cy="413" r="230.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.50" stroke-width="3"/>
  <circle cx="413" cy="413" r="226" fill="none" stroke="url(#rimRed)" stroke-width="10"/>
  <ellipse cx="341" cy="330" rx="76" ry="55" fill="url(#specular)" opacity="0.74"
           transform="rotate(-38 341 330)"/>
  <path d="M 244 285 A 232 232 0 0 1 402 181" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="5" stroke-linecap="round"/>

  <!-- 8. 星芒 -->
  <g filter="url(#blurSpark)" opacity="0.42">
    <path transform="translate(800 268) scale(52)" fill="#FDBA74"
          d="M0 -1Q0.14 -0.14 1 0Q0.14 0.14 0 1Q-0.14 0.14 -1 0Q-0.14 -0.14 0 -1Z"/>
    <path transform="translate(232 742) scale(38)" fill="#FDBA74"
          d="M0 -1Q0.14 -0.14 1 0Q0.14 0.14 0 1Q-0.14 0.14 -1 0Q-0.14 -0.14 0 -1Z"/>
  </g>
  <g>
    <path transform="translate(800 268) scale(46)" fill="#F7E3C4"
          d="M0 -1Q0.14 -0.14 1 0Q0.14 0.14 0 1Q-0.14 0.14 -1 0Q-0.14 -0.14 0 -1Z"/>
    <path transform="translate(232 742) scale(33)" fill="#F2DCC0"
          d="M0 -1Q0.14 -0.14 1 0Q0.14 0.14 0 1Q-0.14 0.14 -1 0Q-0.14 -0.14 0 -1Z"/>
    <path transform="translate(688 176) scale(19)" fill="#FFFFFF" opacity="0.85"
          d="M0 -1Q0.14 -0.14 1 0Q0.14 0.14 0 1Q-0.14 0.14 -1 0Q-0.14 -0.14 0 -1Z"/>
    <path transform="translate(168 452) scale(14)" fill="#FFFFFF" opacity="0.60"
          d="M0 -1Q0.14 -0.14 1 0Q0.14 0.14 0 1Q-0.14 0.14 -1 0Q-0.14 -0.14 0 -1Z"/>
  </g>
</svg>
