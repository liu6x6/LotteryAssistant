<?xml version="1.0" encoding="UTF-8"?>
<!--
  LotteryAssistant · App Icon · Light
  1024×1024 全出血方形（iOS 会自动套 squircle 蒙版，请勿自行画圆角）

  设计说明
  ─────────────────────────────────────────────────────────────
  主体    红球 + 蓝球 = 双色球的「红球/蓝球」，也是彩票品类最强的视觉符号
  背景    深靛蓝渐变 = Theme.swift 的 primary(indigo)，同时对应大乐透主题色
  橙色光  右下 orange 光晕 = Theme.swift 的 accent，暗示「奖池 / 中奖」
  白描边  球体外圈白色细环 = 呼应 NumberBall.swift 里 isSelected 的白色 stroke
  光源    统一左上 45°，故高光在左上、阴影与边缘反光在右下

  安全区  所有关键元素均落在 Apple 建议的中心 Ø824 圆内（实测最远 390px < 412px）
  配色    取自 AppTheme.Color：indigo / orange / redBall / blueBall
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-label="LotteryAssistant">

  <defs>
    <!-- ========== 背景 ========== -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#4F46E5"/>
      <stop offset="0.45" stop-color="#3730A3"/>
      <stop offset="1"    stop-color="#1E1B4B"/>
    </linearGradient>

    <radialGradient id="glowIndigo" cx="0.24" cy="0.20" r="0.62">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowOrange" cx="0.76" cy="0.80" r="0.58">
      <stop offset="0"   stop-color="#F97316" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#EA580C" stop-opacity="0.16"/>
      <stop offset="1"   stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.52" stop-color="#0B0A1F" stop-opacity="0"/>
      <stop offset="1"    stop-color="#0B0A1F" stop-opacity="0.42"/>
    </radialGradient>

    <!-- ========== 红球 ========== -->
    <radialGradient id="ballRed" cx="0.335" cy="0.275" r="0.84">
      <stop offset="0"    stop-color="#FFA3A3"/>
      <stop offset="0.22" stop-color="#FB6373"/>
      <stop offset="0.52" stop-color="#E8243C"/>
      <stop offset="0.82" stop-color="#B3122B"/>
      <stop offset="1"    stop-color="#7A0718"/>
    </radialGradient>

    <linearGradient id="rimRed" x1="0.12" y1="0.08" x2="0.88" y2="0.96">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.56" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.80" stop-color="#FFC48A" stop-opacity="0.45"/>
      <stop offset="1"    stop-color="#FFE7C7" stop-opacity="0.80"/>
    </linearGradient>

    <!-- ========== 蓝球 ========== -->
    <radialGradient id="ballBlue" cx="0.335" cy="0.275" r="0.84">
      <stop offset="0"    stop-color="#BBD9FF"/>
      <stop offset="0.22" stop-color="#6FA8FB"/>
      <stop offset="0.52" stop-color="#2C74E8"/>
      <stop offset="0.82" stop-color="#1B47B4"/>
      <stop offset="1"    stop-color="#122C72"/>
    </radialGradient>

    <linearGradient id="rimBlue" x1="0.12" y1="0.08" x2="0.88" y2="0.96">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#A9CBFF" stop-opacity="0.42"/>
      <stop offset="1"    stop-color="#E4EEFF" stop-opacity="0.75"/>
    </linearGradient>

    <!-- ========== 高光 ========== -->
    <radialGradient id="specular" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- ========== 阴影 / 模糊 ========== -->
    <filter id="dropBall" x="-45%" y="-45%" width="200%" height="200%">
      <feDropShadow dx="20" dy="30" stdDeviation="26"
                    flood-color="#06040F" flood-opacity="0.55"/>
    </filter>

    <filter id="blurContact" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <filter id="blurOrb" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="blurSpark" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <!-- 蓝球裁剪区（用于把红球的接触阴影限制在蓝球表面） -->
    <clipPath id="clipBlue">
      <circle cx="648" cy="648" r="198"/>
    </clipPath>
  </defs>

  <!-- ==================== 1. 背景 ==================== -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glowIndigo)"/>
  <rect width="1024" height="1024" fill="url(#glowOrange)"/>

  <!-- ==================== 2. 摇奖鼓同心环 ==================== -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.055">
    <circle cx="512" cy="512" r="332" stroke-width="2"/>
    <circle cx="512" cy="512" r="452" stroke-width="2.5"/>
  </g>
  <g fill="none" stroke="#FDBA74" stroke-opacity="0.10">
    <circle cx="512" cy="512" r="392" stroke-width="1.5"/>
  </g>

  <!-- ==================== 3. 背景失焦小球（摇奖机氛围） ==================== -->
  <g filter="url(#blurOrb)">
    <circle cx="215" cy="265" r="40" fill="#A5B4FC" opacity="0.16"/>
    <circle cx="845" cy="505" r="30" fill="#FDBA74" opacity="0.18"/>
    <circle cx="325" cy="845" r="34" fill="#FCA5A5" opacity="0.13"/>
    <circle cx="565" cy="150" r="22" fill="#93C5FD" opacity="0.16"/>
    <circle cx="820" cy="775" r="26" fill="#C7D2FE" opacity="0.13"/>
    <circle cx="150" cy="565" r="20" fill="#F9A8D4" opacity="0.11"/>
  </g>

  <!-- ==================== 4. 暗角（聚焦中心） ==================== -->
  <rect width="1024" height="1024" fill="url(#vignette)"/>

  <!-- ==================== 5. 蓝球（后置） ==================== -->
  <g filter="url(#dropBall)">
    <circle cx="648" cy="648" r="198" fill="url(#ballBlue)"/>
  </g>
  <!-- 蓝球边缘白色细环：呼应 NumberBall 的 isSelected 描边，同时把它从深靛背景里分离出来 -->
  <circle cx="648" cy="648" r="196.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="3"/>
  <!-- 蓝球右下边缘反光 -->
  <circle cx="648" cy="648" r="192" fill="none" stroke="url(#rimBlue)" stroke-width="9"/>
  <!-- 蓝球高光 -->
  <ellipse cx="588" cy="580" rx="63" ry="46" fill="url(#specular)" opacity="0.72"
           transform="rotate(-38 588 580)"/>

  <!-- ==================== 6. 红球投在蓝球上的接触阴影 ==================== -->
  <g clip-path="url(#clipBlue)">
    <circle cx="425" cy="425" r="232" fill="#05030C" opacity="0.50" filter="url(#blurContact)"/>
  </g>

  <!-- ==================== 7. 红球（前置，主视觉） ==================== -->
  <g filter="url(#dropBall)">
    <circle cx="413" cy="413" r="232" fill="url(#ballRed)"/>
  </g>
  <circle cx="413" cy="413" r="230.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="3"/>
  <circle cx="413" cy="413" r="226" fill="none" stroke="url(#rimRed)" stroke-width="10"/>
  <ellipse cx="341" cy="330" rx="76" ry="55" fill="url(#specular)" opacity="0.80"
           transform="rotate(-38 341 330)"/>
  <!-- 红球顶部再补一道极细的冷色边光，增强球感 -->
  <path d="M 244 285 A 232 232 0 0 1 402 181" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round"/>

  <!-- ==================== 8. 星芒（暗示中奖 / 奖金） ==================== -->
  <g filter="url(#blurSpark)" opacity="0.55">
    <path transform="translate(800 268) scale(52)" fill="#FDBA74"
          d="M0 -1Q0.14 -0.14 1 0Q0.14 0.14 0 1Q-0.14 0.14 -1 0Q-0.14 -0.14 0 -1Z"/>
    <path transform="translate(232 742) scale(38)" fill="#FDBA74"
          d="M0 -1Q0.14 -0.14 1 0Q0.14 0.14 0 1Q-0.14 0.14 -1 0Q-0.14 -0.14 0 -1Z"/>
  </g>
  <g>
    <path transform="translate(800 268) scale(46)" fill="#FFF3E0"
          d="M0 -1Q0.14 -0.14 1 0Q0.14 0.14 0 1Q-0.14 0.14 -1 0Q-0.14 -0.14 0 -1Z"/>
    <path transform="translate(232 742) scale(33)" fill="#FFE8CC"
          d="M0 -1Q0.14 -0.14 1 0Q0.14 0.14 0 1Q-0.14 0.14 -1 0Q-0.14 -0.14 0 -1Z"/>
    <path transform="translate(688 176) scale(19)" fill="#FFFFFF" opacity="0.92"
          d="M0 -1Q0.14 -0.14 1 0Q0.14 0.14 0 1Q-0.14 0.14 -1 0Q-0.14 -0.14 0 -1Z"/>
    <path transform="translate(168 452) scale(14)" fill="#FFFFFF" opacity="0.70"
          d="M0 -1Q0.14 -0.14 1 0Q0.14 0.14 0 1Q-0.14 0.14 -1 0Q-0.14 -0.14 0 -1Z"/>
  </g>
</svg>
